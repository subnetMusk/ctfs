{% extends 'base.html' %}
{% block content %}
  <h1>Login</h1>
  <form method="post" class="form">
    <label>Username <input type="text" name="username" value="admin" autocomplete="username"></label>
    <label>Password <input type="password" name="password" value="password123" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">Hint for the lesson: default demo user is <code>admin / password123</code>.</p>
{% endblock %}
